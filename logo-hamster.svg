  <g stroke="#c97a86" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <path d="M30 86 L8 83"/>
    <path d="M30 92 L7 96"/>
    <path d="M30 98 L10 104"/>
  </g>
  <g stroke="#c97a86" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <path d="M170 86 L192 83"/>
    <path d="M170 92 L193 96"/>
    <path d="M170 98 L190 104"/>
  </g>

  <!-- Patitas que agarran -->
  <ellipse cx="58" cy="168" rx="13" ry="15" fill="#dc8f4b"/>
  <ellipse cx="142" cy="168" rx="13" ry="15" fill="#dc8f4b"/>

  <!-- Piecitos -->
  <ellipse cx="76" cy="190" rx="14" ry="9" fill="#e9b36b"/>
  <ellipse cx="124" cy="190" rx="14" ry="9" fill="#e9b36b"/>

