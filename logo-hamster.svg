  <ellipse cx="52" cy="84" rx="11" ry="8" fill="#ff9fb5" opacity="0.8"/>
  <ellipse cx="148" cy="84" rx="11" ry="8" fill="#ff9fb5" opacity="0.8"/>

  <!-- Ojos -->
  <circle cx="80" cy="52" r="8.5" fill="#43231a"/>
  <circle cx="120" cy="52" r="8.5" fill="#43231a"/>
  <circle cx="83" cy="49" r="3.2" fill="#fff"/>
  <circle cx="123" cy="49" r="3.2" fill="#fff"/>

  <!-- Nariz -->
  <ellipse cx="100" cy="70" rx="5" ry="4.5" fill="#ff7ea8"/>

  <!-- Dientitos -->
  <rect x="93.5" y="74" width="5.5" height="7" rx="2" fill="#fff" stroke="#e5c9a0" stroke-width="0.8"/>
  <rect x="101" y="74" width="5.5" height="7" rx="2" fill="#fff" stroke="#e5c9a0" stroke-width="0.8"/>

