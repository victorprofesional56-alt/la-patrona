<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#ffd9e4"/>
      <stop offset="100%" stop-color="#ff9fb9"/>
    </radialGradient>
    <radialGradient id="pelo" cx="45%" cy="35%" r="95%">
      <stop offset="0%" stop-color="#f0b36c"/>
      <stop offset="100%" stop-color="#dc8f4b"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#fondo)"/>

  <!-- Orejas -->
  <ellipse cx="44" cy="34" rx="17" ry="20" fill="#dc8f4b"/>
  <ellipse cx="156" cy="34" rx="17" ry="20" fill="#dc8f4b"/>
  <ellipse cx="44" cy="36" rx="10" ry="13" fill="#ffb6c6"/>
  <ellipse cx="156" cy="36" rx="10" ry="13" fill="#ffb6c6"/>

  <!-- Cuerpo rechoncho -->
  <ellipse cx="100" cy="140" rx="64" ry="58" fill="url(#pelo)"/>
  <!-- Panza -->
  <ellipse cx="100" cy="148" rx="36" ry="36" fill="#fde9c9"/>

  <!-- Cabeza (unida al cuerpo = una bolita) -->
  <circle cx="100" cy="63" r="46" fill="url(#pelo)"/>

  <!-- Cachetes bien llenos -->
  <ellipse cx="56" cy="82" rx="34" ry="30" fill="#e9a75c"/>
  <ellipse cx="144" cy="82" rx="34" ry="30" fill="#e9a75c"/>
  <circle cx="100" cy="72" r="34" fill="#e9a75c"/>

  <!-- Hocico crema -->
